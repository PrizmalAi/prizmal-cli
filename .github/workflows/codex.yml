name: Codex

# Checks prizmal's Codex integration. Each harness has its own workflow of
# this kind, so the harnesses run in parallel and report under their own
# names.
#
# launch runs the latest Codex through prizmal with a one-shot prompt,
# against a stub switch that answers every turn with a placeholder reply, and
# passes when that reply reaches stdout. No Switch key is involved.
# PRIZMAL_HARNESS_LAUNCH=require turns a missing harness into a failure, so
# the job cannot pass by skipping.
#
# terminal-baselines compares Codex's screens, drawn in tmux against the same
# stub switch, to the files under cmd/prizmal/testdata/terminal/codex, with the
# Codex version recorded in codex-version beside them.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: codex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install codex
        run: |
          npm install -g @openai/codex@latest
      - name: Launch codex through prizmal
        env:
          PRIZMAL_HARNESS_LAUNCH: require
        run: go test -count=1 -v -run 'TestHarnessLaunchCodex$|TestHarnessLaunchCodexWithoutAModel$' ./cmd/prizmal
      # Skipped on Windows: the launcher hands Codex a token.sh script as its auth
      # command, and Windows cannot start it ("not a valid Win32 application").
      - name: Codex device-key auth
        if: runner.os != 'Windows'
        env:
          PRIZMAL_HARNESS_LAUNCH: require
        run: go test -count=1 -v -run 'TestCodexRerunsTheAuthCommandAfterA401$|TestCodexDiscoveryShapes$|TestCodexDeviceLaunchRunsOnTheDeviceToken$' ./cmd/prizmal

  terminal-baselines:
    # tmux has no native Windows build, and running it under WSL would test
    # Linux again, so the screen baselines run on Linux and macOS only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Codex warns when bubblewrap, its sandbox helper, is missing or cannot
      # create user namespaces, and a developer machine has no such warning.
      # Ubuntu runners restrict unprivileged user namespaces, so the job lifts
      # the restriction.
      - name: Install tmux and bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tmux bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install tmux
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Install the pinned Codex
        run: npm install -g "@openai/codex@$(cat cmd/prizmal/testdata/terminal/codex/codex-version)"
      - name: Compare terminal baselines
        env:
          PRIZMAL_TERMINAL_BASELINES: require
        run: go test -count=1 -v -run 'TestTerminalBaselinesCodex$' ./cmd/prizmal

  # compaction needs the pinned release but no terminal, so it runs on every OS.
  compaction:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install the pinned Codex
        run: npm install -g "@openai/codex@$(cat cmd/prizmal/testdata/terminal/codex/codex-version)"
      - name: Check Codex compacts at the declared window
        env:
          PRIZMAL_HARNESS_LAUNCH: require
        run: go test -count=1 -v -run 'TestHarnessCompactsAtTheDeclaredWindow/codex$' ./cmd/prizmal
