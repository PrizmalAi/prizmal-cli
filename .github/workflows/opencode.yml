name: opencode

# Checks prizmal's opencode integration. Each harness has its own workflow of
# this kind, so the harnesses run in parallel and report under their own
# names.
#
# launch runs opencode through prizmal with a one-shot prompt,
# against a stub switch that answers every turn with a placeholder reply, and
# passes when that reply reaches stdout. No Switch key is involved.
# PRIZMAL_HARNESS_LAUNCH=require turns a missing harness into a failure, so
# the job cannot pass by skipping.
#
# The job installs the opencode release recorded in
# cmd/prizmal/testdata/terminal/opencode/opencode-version, the oldest one a
# launch accepts. It also runs one opencode session against a stub that
# refuses any model name the tenant does not route.
#
# terminal-baselines renders opencode's screens in tmux and compares them to
# the files under cmd/prizmal/testdata/terminal/opencode, on the same pinned
# release.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: opencode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the pinned opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --version "$(cat cmd/prizmal/testdata/terminal/opencode/opencode-version)"
          echo "$HOME/.opencode/bin" >>"$GITHUB_PATH"
      - name: Launch opencode through prizmal
        env:
          PRIZMAL_HARNESS_LAUNCH: require
        run: go test -count=1 -v -run 'TestHarnessLaunchOpencode$|TestHarnessLaunchOpencodeWithoutAModel$' ./cmd/prizmal
      - name: Launch opencode from a device login
        env:
          PRIZMAL_HARNESS_LAUNCH: require
        run: go test -count=1 -v -run 'TestHarnessLaunchOpencodeFromDeviceLogin$' ./cmd/prizmal
      - name: Run an opencode session past a device-token expiry
        env:
          PRIZMAL_HARNESS_LAUNCH: require
        run: go test -count=1 -v -run 'TestHarnessLaunchOpencodeOutlivesOneDeviceToken$' ./cmd/prizmal
      - name: Run opencode's search tool past a device-token expiry
        env:
          PRIZMAL_HARNESS_LAUNCH: require
        run: go test -count=1 -v -run 'TestHarnessLaunchOpencodeSearchOutlivesOneDeviceToken$' ./cmd/prizmal
      - name: OpenCode sends only routable model names
        env:
          PRIZMAL_HARNESS_LAUNCH: require
        run: go test -count=1 -v -run 'TestOpenCodeRunSendsOnlyRoutableNames$|TestOpenCodeRunsInTwoProjectsKeepTheirModelsAndLeaveState$' ./internal/launcher/opencode

  terminal-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Install the pinned opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --version "$(cat cmd/prizmal/testdata/terminal/opencode/opencode-version)"
          echo "$HOME/.opencode/bin" >>"$GITHUB_PATH"
      - name: Compare terminal baselines
        env:
          PRIZMAL_TERMINAL_BASELINES: require
        run: go test -count=1 -v -run 'TestTerminalBaselinesOpencode$' ./cmd/prizmal
      - name: Check OpenCode compacts at the declared window
        env:
          PRIZMAL_TERMINAL_BASELINES: require
        run: go test -count=1 -v -run 'TestHarnessCompactsAtTheDeclaredWindow/opencode$' ./cmd/prizmal
