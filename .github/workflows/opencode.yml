name: opencode

# Checks prizmal's opencode integration. Each harness has its own workflow of
# this kind, so the harnesses run in parallel and report under their own
# names.
#
# launch runs the latest opencode through prizmal with a one-shot prompt,
# against a stub switch that answers every turn with a placeholder reply, and
# passes when that reply reaches stdout. No Switch key is involved.
# PRIZMAL_HARNESS_LAUNCH=require turns a missing harness into a failure, so
# the job cannot pass by skipping.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: opencode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: true
      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >>"$GITHUB_PATH"
      - name: Launch opencode through prizmal
        env:
          PRIZMAL_HARNESS_LAUNCH: require
        run: go test -count=1 -v -run 'TestHarnessLaunchOpencode$' ./cmd/prizmal
