name: Claude Code

# Checks prizmal's Claude Code integration. Each harness has its own workflow
# of this kind (claude-code.yml, codex.yml, ...), so the harnesses run in
# parallel and report under their own names.
#
# launch runs the latest Claude Code through prizmal with a one-shot prompt,
# against a stub switch that answers every turn with a placeholder reply, and
# passes when that reply reaches stdout. No Switch key is involved.
# PRIZMAL_HARNESS_LAUNCH=require turns a missing harness into a failure.
#
# terminal-baselines renders the prizmal model picker and Claude Code's
# screens in a fixed-size tmux terminal, against a stub switch that serves
# GET /v1/models, and compares their text to cmd/prizmal/testdata/terminal/claude.
# It also renders the screens prizmal draws for its own commands (the first-run
# prompt and the device-login flow) and compares them to
# cmd/prizmal/testdata/terminal/prizmal; those need tmux but no Claude Code. See
# the "Terminal baselines" section of AGENTS.md.
#
# Claude Code is installed at the version in
# cmd/prizmal/testdata/terminal/claude/claude-code-version, because its screens change
# with each release. PRIZMAL_TERMINAL_BASELINES=require turns a missing tmux
# or a different Claude Code version into a failure, so this job cannot pass
# by skipping every case.
#
# The compaction job runs TestClaudeCompactsOnTheStatedWindowAndOnARecognizedRefusal
# on every OS, since it needs the pinned Claude Code but no terminal:
# three print-mode queries through prizmal and the pinned Claude Code against
# the stub switch. It asserts that the compaction summary request goes out once
# the count crosses the threshold the launch's window sets, that a refusal in
# the "prompt is too long" shape also starts one, and that neither happens when
# a shim removes the window or the refusal's text is not recognized.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: claude-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The launcher sets ENABLE_TOOL_SEARCH=true on the child environment. Do
  # not declare it in the step env below: the launcher's own value is what
  # this job checks.
  launch:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'schedule' && '["macos-latest"]' || github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install claude
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - name: Install claude
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.local\bin"
      - name: Launch claude through prizmal
        env:
          PRIZMAL_HARNESS_LAUNCH: require
        run: |
          go test -count=1 -v -run 'TestHarnessLaunchClaude$|TestHarnessLaunchClaudeWithoutAModel$' ./cmd/prizmal
          go test -count=1 -v -run '^TestHarnessLaunchClaudeRelay$' ./cmd/prizmal

  terminal-baselines:
    # tmux has no native Windows build, and running it under WSL would test
    # Linux again, so the screen baselines run on Linux and macOS only.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'schedule' && '["macos-latest"]' || github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get update -qq && sudo apt-get install -y -qq tmux; fi
      - name: Install the pinned Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$(cat cmd/prizmal/testdata/terminal/claude/claude-code-version)"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - name: Compare terminal baselines
        env:
          PRIZMAL_TERMINAL_BASELINES: require
        run: go test -count=1 -v -run 'TestTerminalBaselinesClaude|TestTerminalBaselinesPrizmal|TestClaudeTiersStartInAutoMode' ./cmd/prizmal

  compaction:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'schedule' && '["macos-latest"]' || github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the pinned Claude Code
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$(cat cmd/prizmal/testdata/terminal/claude/claude-code-version)"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - name: Install the pinned Claude Code
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-Content cmd/prizmal/testdata/terminal/claude/claude-code-version).Trim()
          & ([scriptblock]::Create((irm https://claude.ai/install.ps1))) $v
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.local\bin"
      - name: Check Claude Code compacts at the declared window
        env:
          PRIZMAL_HARNESS_LAUNCH: require
        run: go test -count=1 -v -run 'TestClaudeCompactsOnTheStatedWindowAndOnARecognizedRefusal' ./cmd/prizmal
