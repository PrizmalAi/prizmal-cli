name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          # The notes step below reads the annotated tag object. A tag-push
          # checkout fetches the commit only, so without this every release
          # silently fell back to the generated changelog.
          fetch-tags: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      # goreleaser always builds its release body from commits. Pass an
      # annotated tag's message instead when there is one, and fall back to
      # the generated changelog when the tag carries no message.
      - name: Read the tag message
        id: notes
        run: |
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ]; then
            exit 0
          fi
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "args=--release-notes $RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
          fi
      # Skipped until the tap App exists; goreleaser then skips the cask push.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: tap-token
        if: vars.HOMEBREW_TAP_APP_CLIENT_ID != ''
        with:
          client-id: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: PrizmalAi
          repositories: homebrew-tap
          permission-contents: write
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
