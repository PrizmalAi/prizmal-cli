name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The notes step below reads the annotated tag object. A tag-push
          # checkout fetches the commit only, so without this every release
          # silently fell back to the generated changelog.
          fetch-tags: true
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      # goreleaser always builds its release body from commits. Pass an
      # annotated tag's message instead when there is one, and fall back to
      # the generated changelog when the tag carries no message.
      - name: Read the tag message
        id: notes
        run: |
          # actions/checkout fetches the annotated tag, then replaces that ref
          # with a lightweight ref to the commit it targets. Read the tag object
          # again before asking for its type and message.
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ]; then
            exit 0
          fi
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "args=--release-notes $RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
          fi
      # Skipped until the tap App exists; goreleaser then skips the cask push.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: tap-token
        if: vars.HOMEBREW_TAP_APP_CLIENT_ID != ''
        with:
          client-id: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: PrizmalAi
          repositories: homebrew-tap
          permission-contents: write
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
